name: Imot.bg Scraper

on:
  schedule:
    - cron: '0 4 * * *'    # 07:00 BG
    - cron: '0 10 * * *'   # 13:00 BG
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl beautifulsoup4 playwright selenium webdriver-manager lxml

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps
          python -m playwright install-deps

      - name: Run scraper
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
        run: python imot_scraper.py

      - name: Commit & Push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/index.html all_listings_history.parquet *.xlsx *.log 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Автоматично обновяване: $(date +'%d.%m.%Y %H:%M')"
            git push
          fi